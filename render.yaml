services:
  - type: web
    name: pentaract
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: 10000
      - key: WORKERS
        value: 4
      - key: CHANNEL_CAPACITY
        value: 100
      - key: DATABASE_HOST
        value: ep-flat-voice-ba0p8utf-pooler.c-8.eu-central-1.aws.neon.tech
      - key: DATABASE_PORT
        value: 5432
      - key: DATABASE_USER
        value: neondb_owner
      - key: DATABASE_PASSWORD
        sync: false
      - key: DATABASE_NAME
        value: neondb
      - key: DATABASE_SSLMODE
        value: require
      - key: SECRET_KEY
        generateValue: true
      - key: SUPERUSER_EMAIL
        sync: false
      - key: SUPERUSER_PASS
        sync: false
